# Local development database only. Credentials here are for localhost use.
services:
  db:
    image: postgres:16
    container_name: market-pulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is first created.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
