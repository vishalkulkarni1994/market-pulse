<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">market-pulse architecture</title>
  <desc id="d">An hourly job fetches Business Standard RSS feeds, stores new articles in Postgres, scores them with an LLM, builds a digest of high-priority items and emails it.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4B5563"/>
    </marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#B7791F"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="42" font-size="20" font-weight="700" fill="#111827">market-pulse</text>
  <text x="30" y="62" font-size="13" fill="#4B5563">Architecture, v1 (one hourly job)</text>

  <!-- External: RSS -->
  <rect x="255" y="20" width="180" height="56" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="345" y="43" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">Business Standard RSS</text>
  <text x="345" y="61" font-size="11" text-anchor="middle" fill="#4B5563">economy, markets feeds</text>

  <!-- External: LLM -->
  <rect x="715" y="20" width="180" height="56" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="805" y="43" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">LLM API</text>
  <text x="805" y="61" font-size="11" text-anchor="middle" fill="#4B5563">returns JSON score</text>

  <!-- Top row -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <rect x="30" y="130" width="170" height="70" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="115" y="160" font-weight="600">Scheduler</text>
    <text x="115" y="180" font-size="11" fill="#4B5563">runs every hour</text>

    <rect x="260" y="130" width="170" height="70" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="345" y="160" font-weight="600">Fetcher</text>
    <text x="345" y="180" font-size="11" fill="#4B5563">parse feeds</text>

    <rect x="490" y="130" width="170" height="70" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="575" y="160" font-weight="600">Dedup + store</text>
    <text x="575" y="180" font-size="11" fill="#4B5563">new URLs only</text>

    <rect x="720" y="130" width="170" height="70" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="805" y="160" font-weight="600">AI scorer</text>
    <text x="805" y="180" font-size="11" fill="#4B5563">priority, direction, reason</text>
  </g>

  <!-- Step badges top -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="30" cy="130" r="12" fill="#3B6FE0"/><text x="30" y="134.5">1</text>
    <circle cx="260" cy="130" r="12" fill="#3B6FE0"/><text x="260" y="134.5">2</text>
    <circle cx="490" cy="130" r="12" fill="#3B6FE0"/><text x="490" y="134.5">3</text>
    <circle cx="720" cy="130" r="12" fill="#3B6FE0"/><text x="720" y="134.5">4</text>
  </g>

  <!-- Top row control flow -->
  <g stroke="#4B5563" stroke-width="1.8" fill="none">
    <path d="M200 165 H258" marker-end="url(#arr)"/>
    <path d="M430 165 H488" marker-end="url(#arr)"/>
    <path d="M660 165 H718" marker-end="url(#arr)"/>
    <path d="M345 76 V128" marker-end="url(#arr)"/>
    <path d="M805 76 V128" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="353" y="106" font-size="11" fill="#4B5563">HTTP GET</text>
  <text x="813" y="106" font-size="11" fill="#4B5563">prompt / JSON</text>

  <!-- Database band -->
  <rect x="30" y="240" width="860" height="100" rx="12" fill="#FFF8EB" stroke="#B7791F" stroke-width="1.8"/>
  <text x="48" y="262" font-size="13" font-weight="700" fill="#7A4F0B">PostgreSQL</text>
  <text x="48" y="280" font-size="11" fill="#7A4F0B">single source of truth;</text>
  <text x="48" y="294" font-size="11" fill="#7A4F0B">steps talk through it</text>

  <g font-size="12" text-anchor="middle" fill="#111827">
    <rect x="470" y="284" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
    <text x="520" y="307" font-weight="600">articles</text>
    <rect x="590" y="284" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
    <text x="640" y="307" font-weight="600">deliveries</text>
    <rect x="755" y="284" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
    <text x="805" y="307" font-weight="600">scores</text>
  </g>

  <!-- DB access (dashed) -->
  <g stroke="#B7791F" stroke-width="1.6" fill="none" stroke-dasharray="5 4">
    <path d="M520 200 V282" marker-end="url(#arrd)"/>
    <path d="M805 200 V282" marker-start="url(#arrd)" marker-end="url(#arrd)"/>
    <path d="M805 340 V418" marker-end="url(#arrd)" transform="translate(0,0)"/>
    <path d="M640 418 V322" marker-end="url(#arrd)"/>
  </g>
  <text x="528" y="230" font-size="11" fill="#7A4F0B">write</text>
  <text x="813" y="222" font-size="11" fill="#7A4F0B">read articles,</text>
  <text x="813" y="236" font-size="11" fill="#7A4F0B">write scores</text>
  <text x="813" y="368" font-size="11" fill="#7A4F0B">read score &gt;= 4</text>
  <text x="813" y="382" font-size="11" fill="#7A4F0B">not yet sent</text>
  <text x="648" y="368" font-size="11" fill="#7A4F0B">record</text>
  <text x="648" y="382" font-size="11" fill="#7A4F0B">delivery</text>

  <!-- Bottom row (right to left) -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <rect x="720" y="420" width="170" height="70" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="805" y="450" font-weight="600">Digest builder</text>
    <text x="805" y="470" font-size="11" fill="#4B5563">priority 4 or 5 only</text>

    <rect x="490" y="420" width="170" height="70" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="575" y="450" font-weight="600">Mailer</text>
    <text x="575" y="470" font-size="11" fill="#4B5563">one email per run</text>

    <rect x="260" y="420" width="170" height="70" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="345" y="450" font-weight="600">Email provider</text>
    <text x="345" y="470" font-size="11" fill="#4B5563">SMTP or API</text>

    <rect x="30" y="420" width="170" height="70" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
    <text x="115" y="450" font-weight="600">Your inbox</text>
    <text x="115" y="470" font-size="11" fill="#4B5563">hourly, if anything qualifies</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="890" cy="420" r="12" fill="#3B6FE0"/><text x="890" y="424.5">5</text>
    <circle cx="660" cy="420" r="12" fill="#3B6FE0"/><text x="660" y="424.5">6</text>
    <circle cx="430" cy="420" r="12" fill="#3B6FE0"/><text x="430" y="424.5">7</text>
  </g>
  <g stroke="#4B5563" stroke-width="1.8" fill="none">
    <path d="M720 455 H662" marker-end="url(#arr)"/>
    <path d="M490 455 H432" marker-end="url(#arr)"/>
    <path d="M260 455 H202" marker-end="url(#arr)"/>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#4B5563">
    <line x1="30" y1="530" x2="70" y2="530" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="78" y="534">control flow (steps run in order)</text>
    <line x1="290" y1="530" x2="330" y2="530" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrd)"/>
    <text x="338" y="534">database read / write</text>
    <rect x="490" y="521" width="30" height="16" rx="4" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="528" y="534">external service</text>
  </g>
</svg>
